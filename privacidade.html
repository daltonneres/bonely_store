<h1>Política de Privacidade</h1>
<p class="upd">Última atualização: outubro de 2026</p>
<p>A Bonely Store respeita a sua privacidade. Esta política explica quais dados coletamos, por que e como você pode controlá-los, conforme a Lei Geral de Proteção de Dados (LGPD, Lei 13.709/2018).</p>
<h2>Dados que coletamos</h2>
<p>Nome, e-mail, telefone, endereço de entrega e CEP, além do histórico dos seus pedidos.</p>
<h2>Para que usamos</h2>
<ul><li>Processar e entregar seus pedidos.</li><li>Calcular frete e emitir o envio.</li><li>Falar com você sobre o pedido pelo WhatsApp.</li><li>Cumprir obrigações legais e fiscais.</li></ul>
<h2>Compartilhamento</h2>
<p>Não vendemos seus dados. Compartilhamos apenas o necessário com serviços de entrega (Correios e transportadoras) e com meios de pagamento.</p>
<h2>Cookies e armazenamento</h2>
<p>Usamos armazenamento essencial do navegador para manter seu carrinho e sua sessão.</p>
<h2>Seus direitos</h2>
<p>Você pode pedir acesso, correção ou exclusão dos seus dados a qualquer momento, falando com a gente pelo WhatsApp ou pelo Instagram.</p>
<p class="tag">Texto-base para revisão da cliente antes da publicação.</p>
