<h1>Política de Cancelamento e Trocas</h1>
<p class="upd">Última atualização: outubro de 2026</p>
<p>Queremos que você fique feliz com a sua compra. Veja como funcionam cancelamentos, trocas e reembolsos.</p>
<h2>Cancelamento antes do pagamento</h2>
<p>O pedido pode ser cancelado sem custo, bastando avisar pelo WhatsApp.</p>
<h2>Cancelamento após o pagamento</h2>
<p>Se o pedido ainda não foi enviado, o cancelamento é feito com reembolso integral.</p>
<h2>Direito de arrependimento</h2>
<p>Em compras online, você pode desistir em até 7 dias corridos após o recebimento (Código de Defesa do Consumidor, art. 49). A peça deve estar sem uso e com etiqueta.</p>
<h2>Troca por defeito ou tamanho</h2>
<p>Solicite em até 7 dias pelo WhatsApp, enviando fotos da peça. Informaremos como proceder com o envio de volta.</p>
<h2>Reembolso</h2>
<p>Feito pela mesma forma de pagamento, em até 10 dias úteis após recebermos a peça.</p>
